<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Para Leandro</title>

  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      color: #00ff9f;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .terminal {
      width: 80%;
      max-width: 800px;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      color: #00ff9f;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

<body>

<div class="terminal">
  <pre id="code"></pre><span class="cursor">|</span>
</div>

<script>
const text = `class Us:
    def __init__(self):
        self.years_together = 11
        self.love = "infinite"
        self.gratitude = True

    def message(self):
        return """
Já são 11 aniversários que passo ao seu lado
e a cada ano fica mais especial.

Obrigada por dividir a vida comigo.
Te amo ❤️
"""

our_story = Us()

while True:
    print(our_story.message())
`;

let i = 0;
const speed = 30;
const codeElement = document.getElementById("code");

function typeWriter() {
  if (i < text.length) {
    codeElement.innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  }
}

typeWriter();
</script>

</body>
</html>
